name: acos-rest16-quad-nl-struct-attn
model:
  name: google/flan-t5-base
  learning_rate: 0.0001
  weight_decay: 0.01
  max_length: 384
  batch_size: 8
  val_batch_size: 32
  warmup_ratio: 0.06
  lr_scheduler: cosine
  max_new_tokens: 128
  label_smoothing: 0.05
  focal_gamma: 0.0
  optimizer: adamw
generation:
  num_beams: 1
  repetition_penalty: 1.0
  length_penalty: 1.0
  do_sample: false
  temperature: 1.0
  num_return_sequences: 1
  vote_threshold: 1
  penalty_alpha: 0.0
  top_k: 0
  num_beam_groups: 1
  diversity_penalty: 0.0
  constrained_decoding: false
trainer:
  from_checkpoint: null
  early_stopping_patience: 0
  max_epochs: 30
  precision: bf16-mixed
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  limit_train_batches: 1.0
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 1
  deterministic: true
  num_workers: 11
  strategy: ddp
data:
  train_file: downloads/ABSADatasets/datasets/acos_datasets/504.Restaurant16/rest16_quad_train.tsv.jsonl
  filter_implicit: false
  infer_implicit: false
  tasks_partition:
    quad: 1.0
  shuffle_tasks: false
  natural_language_fraction: 1.0
  curriculum: null
  syntax_enrichment: dep-compact
  category_set: null
  augmentation:
    duplicate: null
    mask_aspects: null
    nlpaug: null
    llm_paraphrase: null
  structured_attention: true
eval:
  val_split: 0
  data: downloads/ABSADatasets/datasets/acos_datasets/504.Restaurant16/rest16_quad_dev.tsv.jsonl
  tasks:
  - aspect
  - sentiment
  - polarity
  - category
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    - category
    metrics:
    - micro_f1
  - keys:
    - aspect
    - polarity
    - category
    metrics:
    - micro_f1
  - keys:
    - category
    metrics:
    - micro_f1
    - macro_f1
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
  output_format: natural-language
test:
  from_checkpoint: null
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    - category
    metrics:
    - micro_f1
  - keys:
    - aspect
    - polarity
    - category
    metrics:
    - micro_f1
  - keys:
    - category
    metrics:
    - micro_f1
    - macro_f1
  - keys:
    - aspect
    metrics:
    - micro_f1
  - keys:
    - polarity
    metrics:
    - micro_f1
    - macro_f1
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
  datasets:
  - data: downloads/ABSADatasets/datasets/acos_datasets/504.Restaurant16/rest16_quad_test.tsv.jsonl
    tasks:
    - aspect
    - sentiment
    - polarity
    - category
  - data: downloads/ABSADatasets/datasets/acos_datasets/501.Laptop14/laptop_quad_test.tsv.jsonl
    tasks:
    - aspect
    - sentiment
    - polarity
    - category
  filter_implicit: false
  eval_implicit_split: true
  implicit_mode: null
  output_format: natural-language
seed: 42
