name: dmaste-allsource-roberta
model:
  name: roberta-base
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_length: 256
  batch_size: 8
  val_batch_size: 16
  warmup_ratio: 0.1
  lr_scheduler: cosine
  max_new_tokens: 64
  label_smoothing: 0.05
  focal_gamma: 0.0
  optimizer: adamw
  type: span
  span_hidden: 256
generation:
  num_beams: 1
  repetition_penalty: 1.0
  length_penalty: 1.0
  do_sample: false
  temperature: 1.0
  num_return_sequences: 1
  vote_threshold: 1
  penalty_alpha: 0.0
  top_k: 0
  num_beam_groups: 1
  diversity_penalty: 0.0
  constrained_decoding: false
trainer:
  from_checkpoint: null
  early_stopping_patience: 5
  max_epochs: 20
  precision: bf16-mixed
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  limit_train_batches: 1.0
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 1
  deterministic: true
  num_workers: 11
  strategy: auto
data:
  train_file:
  - downloads/DMASTE/dataset/electronics/train.txt
  - downloads/DMASTE/dataset/beauty/train.txt
  - downloads/DMASTE/dataset/fashion/train.txt
  - downloads/DMASTE/dataset/home/train.txt
  train_fraction: 1.0
  language: en
  spacy_model: en_core_web_sm
  filter_implicit: false
  infer_implicit: false
  tasks_partition:
    aspect: 0.3
    polarity: 0.3
    sentiment: 0.3
    full: 0.1
  shuffle_tasks: false
  natural_language_fraction: 0.0
  curriculum: null
  syntax_enrichment: null
  category_set: null
  include_categories: false
  augmentation:
    duplicate: null
    mask_aspects: null
    nlpaug: null
    llm_paraphrase: null
eval:
  val_split: 0
  data:
  - downloads/DMASTE/dataset/electronics/dev.txt
  - downloads/DMASTE/dataset/beauty/dev.txt
  - downloads/DMASTE/dataset/fashion/dev.txt
  - downloads/DMASTE/dataset/home/dev.txt
  tasks:
  - aspect
  - sentiment
  - polarity
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
test:
  from_checkpoint: null
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
    - rouge_l
    token_threshold: 0.8
  - keys:
    - aspect
    metrics:
    - micro_f1
    - soft_f1
    - rouge_l
    - token_f1
    - avg_overlap
    soft_threshold: 0.8
    token_threshold: 0.8
  - keys:
    - sentiment
    metrics:
    - micro_f1
    - rouge_l
    - token_f1
    - avg_overlap
    token_threshold: 0.8
  - keys:
    - aspect
    - sentiment
    metrics:
    - micro_f1
  - keys:
    - polarity
    metrics:
    - micro_f1
    - macro_f1
  datasets:
  - data: downloads/DMASTE/dataset/book/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/DMASTE/dataset/grocery/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/DMASTE/dataset/pet/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/DMASTE/dataset/toy/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  filter_implicit: false
  eval_implicit_split: false
  implicit_mode: null
seed: 42
