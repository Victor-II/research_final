name: bert-ro-baseline
model:
  name: dumitrescustefan/bert-base-romanian-cased-v1
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_length: 256
  batch_size: 16
  val_batch_size: 32
  warmup_ratio: 0.06
  lr_scheduler: cosine
  max_new_tokens: 64
  label_smoothing: 0.05
  focal_gamma: 0.0
  optimizer: adamw
  type: classifier
  categories:
  - experience
  - durability
  - performance
  - battery
  - price_quality
  - design
  - camera
  - audio
  - software
  - brand
  - service
  polarities:
  - positive
  - negative
  - neutral
generation:
  num_beams: 1
  repetition_penalty: 1.0
  length_penalty: 1.0
  do_sample: false
  temperature: 1.0
  num_return_sequences: 1
  vote_threshold: 1
  penalty_alpha: 0.0
  top_k: 0
  num_beam_groups: 1
  diversity_penalty: 0.0
  constrained_decoding: false
trainer:
  from_checkpoint: null
  early_stopping_patience: 3
  max_epochs: 8
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  limit_train_batches: 1.0
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 1
  deterministic: true
  num_workers: 11
  strategy: auto
data:
  train_file: downloads/emag_ro/ror-train-gpt4_1.csv
  train_fraction: 1.0
  language: en
  spacy_model: en_core_web_sm
  filter_implicit: false
  infer_implicit: false
  tasks_partition:
    aspect: 0.3
    polarity: 0.3
    sentiment: 0.3
    full: 0.1
  shuffle_tasks: false
  natural_language_fraction: 0.0
  curriculum: null
  syntax_enrichment: null
  category_set: null
  include_categories: false
  output_format: null
  mvp_top_k: 0
  star_pairwise: false
  star_balanced_loss: false
  augmentation:
    duplicate: null
    mask_aspects: null
    nlpaug: null
    llm_paraphrase: null
eval:
  val_split: 0.1
  data: null
  tasks:
  - aspect
  - sentiment
  - polarity
  scopes:
  - keys:
    - polarity
    - category
    metrics:
    - micro_f1
  - keys:
    - polarity
    metrics:
    - micro_f1
    - macro_f1
  - keys:
    - category
    metrics:
    - micro_f1
test:
  from_checkpoint: null
  scopes:
  - keys:
    - polarity
    - category
    metrics:
    - micro_f1
  - keys:
    - polarity
    metrics:
    - micro_f1
    - macro_f1
  - keys:
    - category
    metrics:
    - micro_f1
  datasets:
  - data: downloads/emag_ro/emag-phone-review-test.csv
    tasks:
    - polarity
    - category
  filter_implicit: false
  eval_implicit_split: false
  implicit_mode: null
seed: 42
