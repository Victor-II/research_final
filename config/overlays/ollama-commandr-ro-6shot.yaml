name: "ollama-commandr-ro-6shot"

model:
  type: "ollama"
  name: "command-r:latest"
  n_shots: 6
  output_format: "structured"
  max_new_tokens: 128
  demo_selection: "hybrid"

data:
  train_file:
    - "downloads/emag_ro/ror-train-gpt4_1.csv"

test:
  scopes:
    - keys: ["polarity", "category"]
      metrics: [micro_f1]
    - keys: ["polarity"]
      metrics: [micro_f1, macro_f1]
    - keys: ["category"]
      metrics: [micro_f1]
  datasets:
    - data: "downloads/emag_ro/emag-phone-review-test.csv"
      tasks: ["category", "polarity"]
      demo_source: "downloads/emag_ro/ror-train-gpt4_1.csv"

seed: 42
