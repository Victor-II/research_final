name: "ood-silviolima-test"

model:
  name: "google/flan-t5-base"
  max_length: 256
  batch_size: 4
  val_batch_size: 32
  max_new_tokens: 64

data:
  train_file: "downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/train.txt"
  syntax_enrichment: "dep-compact"
  natural_language_fraction: 1.0
  filter_implicit: false

test:
  from_checkpoint: "experiments/2026-05-01/nl-dep-compact/checkpoints/best.ckpt"
  output_format: "natural-language"
  filter_implicit: false
  scopes:
    - keys: ["aspect", "sentiment", "polarity"]
      metrics: [micro_f1]
    - keys: ["aspect"]
      metrics: [micro_f1]
    - keys: ["polarity"]
      metrics: [micro_f1, macro_f1]
  datasets:
    - data: "downloads/silviolima/electronics.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/laptop.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/home.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/fashion.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/beauty.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/grocery.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/book.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/pet.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/toy.json"
      tasks: ["aspect", "sentiment", "polarity"]
    - data: "downloads/silviolima/restaurant.json"
      tasks: ["aspect", "sentiment", "polarity"]
