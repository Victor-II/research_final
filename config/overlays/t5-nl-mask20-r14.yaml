name: t5-nl-mask20-r14
model:
  name: google/flan-t5-base
  learning_rate: 0.0003
  weight_decay: 0.01
  max_length: 256
  batch_size: 8
  val_batch_size: 32
  warmup_ratio: 0.06
  lr_scheduler: cosine
  max_new_tokens: 64
  label_smoothing: 0.05
generation:
  num_beams: 1
trainer:
  max_epochs: 30
  precision: bf16-mixed
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  reload_dataloaders_every_n_epochs: 1
  deterministic: true
  early_stopping_patience: 10
data:
  train_file:
  - downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/train.txt
  filter_implicit: false
  tasks_partition:
    full: 1.0
  shuffle_tasks: false
  natural_language_fraction: 1.0
  syntax_enrichment: null
  augmentation:
    mask_aspects:
      fraction: 0.2
      replace: true
      mask_target: false
eval:
  val_split: 0
  data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/dev.txt
  tasks:
  - aspect
  - sentiment
  - polarity
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
  output_format: natural-language
test:
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
  - keys:
    - aspect
    metrics:
    - micro_f1
  - keys:
    - polarity
    metrics:
    - micro_f1
    - macro_f1
  datasets:
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/403.Restaurant15/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/404.Restaurant16/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/401.Laptop14/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  output_format: natural-language
seed: 42
