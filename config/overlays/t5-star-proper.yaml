name: t5-star-proper
model:
  name: google/flan-t5-base
  learning_rate: 0.0001
  weight_decay: 0.01
  max_length: 256
  batch_size: 8
  val_batch_size: 32
  warmup_ratio: 0.06
  lr_scheduler: cosine
  max_new_tokens: 128
  label_smoothing: 0.0
generation:
  num_beams: 1
trainer:
  max_epochs: 20
  precision: bf16-mixed
  accumulate_grad_batches: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  reload_dataloaders_every_n_epochs: 1
  deterministic: true
  early_stopping_patience: 7
data:
  train_file:
  - downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/train.txt
  filter_implicit: false
  tasks_partition:
    full: 1.0
  shuffle_tasks: false
  natural_language_fraction: 0.0
  syntax_enrichment: null
  output_format: mvp-markers
  mvp_top_k: 5
  star_pairwise: true
  star_balanced_loss: true
eval:
  val_split: 0
  data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/dev.txt
  tasks:
  - aspect
  - sentiment
  - polarity
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
  output_format: mvp-markers
test:
  mvp_vote_threshold: 3
  scopes:
  - keys:
    - aspect
    - sentiment
    - polarity
    metrics:
    - micro_f1
  datasets:
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/402.Restaurant14/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/403.Restaurant15/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/404.Restaurant16/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  - data: downloads/ABSADatasets/datasets/aste_datasets/400.SemEval/401.Laptop14/test.txt
    tasks:
    - aspect
    - sentiment
    - polarity
  output_format: mvp-markers
seed: 42
