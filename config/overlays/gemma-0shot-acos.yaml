name: "gemma-0shot-acos"

model:
  type: "causal-lm"
  name: "google/gemma-4-E4B-it"
  n_shots: 0
  output_format: "structured"
  max_new_tokens: 256
  n_gpus: 2

data:
  train_file: "downloads/ABSADatasets/datasets/acos_datasets/504.Restaurant16/rest16_quad_train.tsv.jsonl"

test:
  scopes:
    - keys: ["aspect", "sentiment", "polarity", "category"]
      metrics: [micro_f1]
    - keys: ["aspect"]
      metrics: [micro_f1]
    - keys: ["polarity"]
      metrics: [micro_f1, macro_f1]
  datasets:
    - data: "downloads/ABSADatasets/datasets/acos_datasets/504.Restaurant16/rest16_quad_test.tsv.jsonl"
      tasks: ["aspect", "sentiment", "polarity", "category"]
    - data: "downloads/ABSADatasets/datasets/acos_datasets/501.Laptop14/laptop_quad_test.tsv.jsonl"
      tasks: ["aspect", "sentiment", "polarity", "category"]

seed: 42
